<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cognivo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{
  --bg:#1c1c1c;--panel:#0d0d0d;--card:#1a1a1a;--card2:#222;--line:#2a2a2a;
  --text:#f2f2f2;--muted:#9a9a9a;--dim:#5e5e5e;--accent:#ff8a3d;--accent2:#ff6a13;
  --radius:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:Outfit,system-ui,sans-serif;font-size:15px;display:flex;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.logo svg{fill:var(--accent);stroke:none}

/* Sidebar */
aside{width:230px;min-width:230px;display:flex;flex-direction:column;padding:16px 10px 10px;transition:margin .25s}
body.collapsed aside{margin-left:-240px}
.brand{display:flex;align-items:center;justify-content:space-between;padding:0 0 16px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:500}
.brand .logo svg{width:32px;height:32px}
.iconbtn{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:#3a3a3a;color:#ccc}
.newchat{margin:18px 0 12px;display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border-radius:8px;padding:10px 10px;font-weight:500}
.newchat kbd{margin-left:auto;font:11px Outfit;background:rgba(255,255,255,.2);padding:2px 5px;border-radius:4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 4px;border-radius:8px;text-align:left}
.nav button:hover,.hist button:hover{background:#262626}
.nav svg{width:17px;height:17px}
.nav button.on{background:rgba(255,138,61,.12);color:var(--accent)}
.modechip{display:none;align-items:center;gap:6px;color:var(--accent);background:rgba(255,138,61,.08);box-shadow:inset 0 0 0 1px var(--accent);border-radius:9px;padding:5px 10px;font-size:14px}
body.imgmode .modechip{display:flex}
.modechip select{background:none;border:0;color:var(--accent);font:inherit;font-size:13px;outline:0}
.modechip select option{background:#222;color:var(--text)}
.modechip button{color:var(--accent);padding:0 2px}
.attach{padding:7px;border-radius:9px;color:#bbb;display:flex}
.attach:hover{background:#2a2a2a;color:var(--text)}
.chip img{width:28px;height:28px;object-fit:cover;border-radius:5px}
.msg.user .thumb{display:block;max-width:220px;border-radius:10px;margin-bottom:6px}
.gen{display:block;max-width:min(100%,512px);border-radius:12px;border:1px solid var(--line)}
.genwait{width:min(100%,384px);aspect-ratio:1;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);background:linear-gradient(110deg,#151515 30%,#222 50%,#151515 70%);background-size:200% 100%;animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.hist{flex:1;overflow-y:auto;margin-top:14px;-webkit-mask-image:linear-gradient(#000 80%,transparent)}
.hist h6{font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.04em;margin:12px 0 4px;text-transform:uppercase}
.hist .item{display:flex;align-items:center;border-radius:8px}
.hist .item button.t{flex:1;text-align:left;padding:7px 4px 7px 14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.hist .item.active{background:#2a2a2a}
.hist .item .del{opacity:0;padding:4px;color:var(--muted)}
.hist .item:hover .del{opacity:1}
.hist .del svg{width:14px;height:14px}
.settings{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px}
.settings:hover{background:#262626}
.user{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ff8a3d,#7a3cff);display:grid;place-items:center;font-weight:600}
.user small{display:block;color:var(--muted)}

/* Main */
main{flex:1;margin:12px 12px 12px 10px;background:var(--panel);border-radius:22px;display:flex;flex-direction:column;min-width:0;position:relative}
header{display:flex;align-items:center;gap:10px;padding:14px 24px;border-bottom:1px solid var(--line)}
.model{position:relative}
.model>button{display:flex;align-items:center;gap:8px;font-size:18px;padding:6px 8px;border-radius:8px}
.model>button:hover{background:#1d1d1d}
.menu{position:absolute;top:110%;left:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:240px;z-index:20;display:none;max-height:300px;overflow:auto}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;padding:8px 10px;border-radius:8px;font-size:14px}
.menu button:hover,.menu button.on{background:#333}
header .sp{flex:1}
.hbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.hbtn:hover{background:#1a1a1a}
.dots{padding:8px;color:var(--muted)}

.scroll{flex:1;overflow-y:auto;padding:0 24px}
.welcome{max-width:720px;margin:0 auto;display:flex;flex-direction:column;align-items:center;padding-top:6vh}
.upgrade{display:flex;align-items:center;gap:8px;background:#1d1d1d;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:16px}
.upgrade b{color:var(--accent);font-weight:500}
.upgrade svg{color:var(--accent);width:18px}
.welcome .logo svg{width:64px;height:64px;margin:28px 0 20px}
.welcome h1{font-size:clamp(26px,3.6vw,40px);font-weight:500;letter-spacing:-.01em;margin-bottom:28px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;width:100%;margin-top:18px}
.cards button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 14px}
.cards button:hover{border-color:#3a3a3a;background:#1f1f1f}
.cards h3{font-size:16px;font-weight:400;margin:8px 0 6px}
.cards p{font-size:13px;color:var(--muted);line-height:1.5}

/* Messages */
.thread{max-width:760px;margin:0 auto;padding:28px 0 20px;display:flex;flex-direction:column;gap:22px}
.msg{display:flex;gap:12px;line-height:1.65}
.msg.user{justify-content:flex-end}
.msg.user .b{background:#232323;border:1px solid var(--line);padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:80%;white-space:pre-wrap}
.msg.bot .ic svg{width:26px;height:26px;fill:var(--accent);stroke:none}
.msg.bot .b{flex:1;min-width:0}
.b p{margin:0 0 .7em}.b ul,.b ol{margin:0 0 .7em 1.3em}
.b pre{background:#161616;border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;margin:.5em 0 .8em;font-size:13px}
.b code{font-family:ui-monospace,Consolas,monospace;font-size:.9em}
.b :not(pre)>code{background:#262626;padding:1px 5px;border-radius:4px}
.b a{color:var(--accent)}
.b table{border-collapse:collapse;margin:.5em 0}.b td,.b th{border:1px solid var(--line);padding:4px 8px}
.acts{display:flex;gap:4px;margin-top:4px;color:var(--dim)}
.acts button{padding:4px;border-radius:6px}.acts button:hover{color:var(--text);background:#1f1f1f}
.acts svg{width:16px;height:16px}
.cursor::after{content:"▍";color:var(--accent);animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.err{color:#ff7b7b}

/* Composer */
.composer-wrap{padding:0 24px 24px}
.composer-wrap.center{position:static}
.composer{max-width:720px;margin:0 auto;width:100%;background:#191919;border:1px solid var(--line);border-radius:var(--radius)}
.box{background:#121212;border-radius:var(--radius);border:1px solid var(--line);margin:-1px;padding:14px 16px 10px}
textarea{width:100%;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;resize:none;min-height:44px;max-height:220px}
textarea::placeholder{color:var(--dim)}
.files{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{display:flex;align-items:center;gap:6px;background:#242424;border-radius:8px;padding:4px 8px;font-size:12px}
.chip button{color:var(--muted)}
.tools{display:flex;align-items:center;gap:6px;margin-top:6px}
.tg{display:flex;align-items:center;gap:4px;background:#1d1d1d;border-radius:12px;padding:4px}
.tg button,.tools>button{padding:7px;border-radius:9px;color:#bbb;display:flex;align-items:center;gap:6px}
.tg button:hover,.tools>button:hover{background:#2a2a2a}
.tg button.on,.tools>button.on{color:var(--accent);background:rgba(255,138,61,.08);box-shadow:inset 0 0 0 1px var(--accent)}
.research span{font-size:14px}
.tools .sp{flex:1}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent)!important;color:#fff!important;justify-content:center}
.send svg{fill:#fff}
.send.stop svg{fill:#fff;stroke:none}
.connect{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;color:#bbb}
.dots4{display:flex}.dots4 i{width:18px;height:18px;border-radius:50%;border:2px solid #191919;margin-left:-6px}
.foot{text-align:center;font-size:13px;color:var(--muted);padding:10px 0 14px}
.foot a{color:var(--text)}
.fab{position:absolute;right:24px;bottom:16px;display:flex;gap:10px}
.fab button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}

/* Modal */
dialog{margin:auto;background:#171717;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h2{font-weight:500;margin-bottom:14px}
dialog label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
dialog input,dialog textarea,dialog select{width:100%;background:#0f0f0f;border:1px solid var(--line);border-radius:8px;padding:9px;color:var(--text);font:inherit;font-size:14px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
dialog .row button{padding:8px 14px;border-radius:8px;border:1px solid var(--line)}
dialog .row .pri{background:var(--accent);border-color:var(--accent);color:#fff}
.status{font-size:13px;margin-top:14px;padding-top:10px;border-top:1px solid var(--line);color:var(--muted)}
.status.ok{color:#5fd37a}.status.bad{color:#ff7b7b}
.hint{font-size:13px;color:var(--muted)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2b2b2b;padding:9px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.openbtn{display:none}
body.collapsed .openbtn{display:grid}

@media (max-width:820px){
  aside{position:fixed;z-index:30;height:100%;background:var(--bg);box-shadow:0 0 40px #000}
  body:not(.collapsed) main{pointer-events:none;opacity:.4}
  main{margin:0;border-radius:0}
  .cards{grid-template-columns:1fr}
  .hbtn span,.connect .dots4{display:none}
  header,.scroll,.composer-wrap{padding-left:16px;padding-right:16px}
  .fab{display:none}
}
</style>
</head>
<body>
<svg style="display:none"><symbol id="lg" viewBox="0 0 64 64"><path d="M14 4h8v14h14V4h8v14h14v8H44v14h14v8H44v14h-8V48H22v12h-8V48H4v-8h10V26H4v-8h10zM22 26v14h14V26z"/></symbol></svg>

<aside>
  <div class="brand">
    <div class="logo"><svg><use href="#lg"/></svg>Cognivo</div>
    <button class="iconbtn" id="collapse" title="Collapse sidebar"><svg viewBox="0 0 24 24"><path d="M10 12h10M14 8l-4 4 4 4M4 4v16"/></svg></button>
  </div>
  <button class="newchat" id="newChat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>New Chat<kbd>Ctrl N</kbd></button>
  <div class="nav">
    <button id="imgModeBtn"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>Image Generation</button>
    <button id="kbBtn"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M7.5 7.5 11 16M16.5 7.5 13 16"/></svg>Knowledge Base</button>
    <button id="tplBtn"><svg viewBox="0 0 24 24"><path d="M12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 11v10"/></svg>Templates</button>
  </div>
  <div class="hist" id="hist"></div>
  <button class="settings" id="settingsBtn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 14H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 3V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 10h.1a2 2 0 1 1 0 4z"/></svg>Settings</button>
  <div class="user"><div class="avatar" id="avatar">U</div><div style="flex:1"><div id="uname">You</div><small id="conn">Not connected</small></div></div>
</aside>

<main>
  <header>
    <button class="iconbtn openbtn" id="openSide" title="Open sidebar"><svg viewBox="0 0 24 24"><path d="M14 12H4M10 8l4 4-4 4M20 4v16"/></svg></button>
    <div class="model">
      <button id="modelBtn"><span id="modelName">Cognivo Core v1</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="modelMenu"></div>
    </div>
    <div class="sp"></div>
    <div class="model"><button class="dots" id="moreBtn"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></button>
      <div class="menu" id="moreMenu" style="left:auto;right:0">
        <button data-act="rename">Rename chat</button><button data-act="export">Export as Markdown</button><button data-act="delete">Delete chat</button><button data-act="clear">Delete all chats</button>
      </div></div>
    <button class="hbtn" id="linkBtn" title="Copy link"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
    <button class="hbtn" id="shareBtn"><svg viewBox="0 0 24 24"><path d="M14 5l7 7-7 7v-4c-6 0-9 2-11 5 1-6 4-10 11-11z"/></svg><span>Share</span></button>
  </header>

  <div class="scroll" id="scroll">
    <div class="welcome" id="welcome">
      <button class="upgrade" id="upgradeBtn"><svg viewBox="0 0 24 24"><path d="m3 21 12-12M15 3v3M18 6h3M13 6h0M18 11v0M9 3l.5 1.5M20 14l-1.5-.5"/></svg><b>Upgrade</b> free plan to full access</button>
      <div class="logo"><svg><use href="#lg"/></svg></div>
      <h1>Let’s start a smart conversation</h1>
    </div>
    <div class="thread" id="thread" hidden></div>
  </div>

  <div class="composer-wrap" id="composerWrap">
    <div class="composer">
      <div class="box">
        <div class="files" id="files"></div>
        <textarea id="input" rows="2" placeholder="Ask me anything..."></textarea>
        <div class="tools">
          <span class="modechip" id="modeChip">🖼 Image mode
            <select id="imgSize" title="Image size"><option>512x512</option><option>768x768</option><option>1024x1024</option></select>
            <button id="modeOff" title="Back to chat">✕</button></span>
          <button class="attach" id="attachBtn" title="Upload photo or file"><svg viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5 5 0 0 1-7-7L14 4a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button>
          <input type="file" id="fileIn" multiple hidden accept="image/*,.txt,.md,.py,.js,.ts,.tsx,.jsx,.json,.csv,.html,.css,.java,.c,.cpp,.h,.cs,.go,.rs,.rb,.php,.sh,.sql,.yaml,.yml,.xml,.log,.ini,.toml">
          <div class="sp"></div>
          <button class="send" id="sendBtn" title="Send"><svg viewBox="0 0 24 24"><path d="M5 4l15 8-15 8 3-8z"/></svg></button>
        </div>
      </div>
    </div>
  </div>
</main>



<dialog id="settingsDlg"><form method="dialog">
  <h2>Cognivo — Kaggle Connection</h2>
  <p class="hint">Paste the 3 values printed by the Kaggle cell.</p>
  <label>1. API Base URL</label>
  <input id="sBase" placeholder="https://xxxx.trycloudflare.com/v1" autocomplete="off" spellcheck="false">
  <label>2. Model ID</label>
  <input id="sModel" list="sModels" placeholder="Qwen/Qwen2.5-Coder-1.5B-Instruct" autocomplete="off" spellcheck="false">
  <datalist id="sModels"></datalist>
  <label>3. API Access Token</label>
  <input id="sKey" type="password" placeholder="<random token>" autocomplete="off">
  <div class="status" id="sStatus">Status: not tested</div>
  <div class="row"><button value="cancel">Cancel</button><button type="button" id="testBtn">Test Connection</button><button class="pri" value="save" id="saveBtn">Save Settings</button></div>
</form></dialog>

<dialog id="infoDlg"><form method="dialog"><h2 id="infoT"></h2><div id="infoB" style="color:#ccc;line-height:1.6;font-size:14px"></div><div class="row"><button class="pri">OK</button></div></form></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const LS = {get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const defaults = {base: location.protocol.startsWith('http') ? location.origin + '/v1' : 'http://localhost:8000/v1', key:'', model:'', name:'You',
  sys:'You are Cognivo, a helpful, precise AI assistant. Use Markdown when helpful.', temp:0.7, max:1024, lang:''};
let cfg = {...defaults, ...LS.get('cg.cfg',{})};
let chats = LS.get('cg.chats', []);
let cur = null, ctrl = null, attachments = [];
const flags = {research:false, think:false, concise:false};

const toast = m => {const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)};
const save = () => LS.set('cg.chats', chats);
const md = s => window.marked ? DOMPurify.sanitize(marked.parse(s||''),{FORBID_TAGS:['img','video','audio','iframe','form','style','svg'],FORBID_ATTR:['style','srcset']}) : (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/\n/g,'<br>');
const esc = s => s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const headers = () => ({'Content-Type':'application/json', ...(cfg.key?{Authorization:'Bearer '+cfg.key}:{})});

/* ---------- history ---------- */
function renderHist(){
  const now = new Date(), day = 864e5, sod = new Date(now.toDateString()).getTime();
  const groups = {};
  [...chats].sort((a,b)=>b.updated-a.updated).forEach(c=>{
    const g = c.updated>=sod ? 'Today' : c.updated>=sod-day ? 'Yesterday' : c.updated>=sod-7*day ? 'Previous 7 days' : new Date(c.updated).toLocaleString('en',{month:'long'});
    (groups[g] ||= []).push(c);
  });
  $('#hist').innerHTML = Object.entries(groups).map(([g,list])=>`<h6>${g}</h6>`+list.map(c=>
    `<div class="item ${cur&&cur.id===c.id?'active':''}" data-id="${c.id}"><button class="t">${esc(c.title)}</button><button class="del" title="Delete"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button></div>`).join('')).join('')
    || '<h6>No chats yet</h6>';
}
$('#hist').onclick = e => {
  const it = e.target.closest('.item'); if(!it) return;
  if(e.target.closest('.del')) return deleteChat(it.dataset.id);
  openChat(it.dataset.id);
};
function openChat(id){ stop(); cur = chats.find(c=>c.id===id)||null; renderThread(); renderHist(); if(innerWidth<820) document.body.classList.add('collapsed'); }
function newChat(){ stop(); cur=null; attachments=[]; renderFiles(); renderThread(); renderHist(); $('#input').focus(); }
function deleteChat(id){ if(!confirm('Delete this chat?')) return; chats=chats.filter(c=>c.id!==id); if(cur&&cur.id===id) cur=null; save(); renderThread(); renderHist(); }

/* ---------- thread ---------- */
function renderThread(){
  const has = cur && cur.messages.length;
   $('#thread').hidden = !has;
  $('#composerWrap').classList.toggle('center', !has);
  if(!has){ $('#thread').innerHTML=''; return; }
  $('#thread').innerHTML = cur.messages.map((m,i)=>msgHTML(m,i)).join('');
  scrollDown();
}
const okImg = u => typeof u==='string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(u);
function msgHTML(m,i){
  if(m.img && m.role==='assistant') return `<div class="msg bot" data-i="${i}"><div class="ic"><svg><use href="#lg"/></svg></div><div style="flex:1;min-width:0"><div class="b ${m.error?'err':''}">${
    m.error ? md(m.errText) : okImg(m.image) ? `<img class="gen" alt="${esc(m.content)}" src="${m.image}">` : '<div class="genwait">Generating image…</div>'}</div>
  <div class="acts">${okImg(m.image)?'<button data-a="dl" title="Download"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>':''}<button data-a="regen" title="Regenerate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button></div></div></div>`;
  if(m.role==='user') return `<div class="msg user"><div class="b">${okImg(m.thumb)?`<img class="thumb" src="${m.thumb}" alt="">`:''}${esc(m.display??m.content)}</div></div>`;
  return `<div class="msg bot" data-i="${i}"><div class="ic"><svg><use href="#lg"/></svg></div><div style="flex:1;min-width:0"><div class="b ${m.error?'err':''}">${md(m.content)}</div>
  <div class="acts"><button data-a="copy" title="Copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h9"/></svg></button><button data-a="regen" title="Regenerate"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></svg></button><button data-a="speak" title="Read aloud"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM16 9a4 4 0 0 1 0 6M19 6a8 8 0 0 1 0 12"/></svg></button></div></div></div>`;
}
const scrollDown = () => { const s=$('#scroll'); s.scrollTop = s.scrollHeight; };
$('#thread').onclick = e => {
  const b = e.target.closest('[data-a]'); if(!b) return;
  const i = +b.closest('.msg').dataset.i, m = cur.messages[i];
  if(b.dataset.a==='copy'){ navigator.clipboard.writeText(m.content); toast('Copied'); }
  if(b.dataset.a==='speak'){ speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(m.content.replace(/[#*`_>]/g,''))); }
  if(b.dataset.a==='dl') Object.assign(document.createElement('a'),{href:m.image,download:(m.content.replace(/[^\w ]/g,'').slice(0,40)||'image')+'.jpg'}).click();
  if(b.dataset.a==='regen' && !ctrl){ cur.messages.splice(i); renderThread(); m.img ? generateImage(m.content, m.src) : generate(); }
};

/* ---------- sending ---------- */
async function send(){
  if(ctrl) return stop();
  const text = $('#input').value.trim();
  if(!text && !attachments.length) return;
  if(imgMode && !text) return toast(attachments.length ? 'Describe how to change the photo' : 'Describe the image you want');
  const hasPhoto = attachments.some(a=>a.type==='image');
  if(hasPhoto && !imgMode){ toast('The chat model can’t see photos — turn on Image Generation to edit a photo'); return; }
  if(!cur){ cur = {id:crypto.randomUUID?.()||String(Date.now()), title:(text||attachments[0].name).slice(0,60), messages:[], updated:Date.now()}; chats.push(cur); }
  const images = attachments.filter(a=>a.type==='image');
  const docs = attachments.filter(a=>a.type==='text');
  let full = text + docs.map(d=>`\n\n--- File: ${d.name} ---\n${d.data}`).join('');
  const content = images.length ? [{type:'text',text:full}, ...images.map(im=>({type:'image_url',image_url:{url:im.data}}))] : full;
  const display = text + (attachments.length ? `\n📎 ${attachments.map(a=>a.name).join(', ')}` : '');
  if(imgMode){
    const photo = attachments.find(a=>a.type==='image');
    cur.messages.push({role:'user', content:text, display:'🖼 '+text, img:true, thumb:photo?.thumb});
    $('#input').value=''; autosize(); attachments=[]; renderFiles(); renderThread(); renderHist();
    return generateImage(text, photo?.data);
  }
  cur.messages.push({role:'user', content, display});
  $('#input').value=''; autosize(); attachments=[]; renderFiles();
  renderThread(); renderHist();
  generate();
}

function systemPrompt(){
  let s = cfg.sys;
  if(flags.research) s += '\n\nDEEPER RESEARCH MODE: Give a thorough, well-structured, multi-section answer. Consider multiple perspectives, list assumptions, and finish with a concise summary.';
  if(flags.think) s += '\n\nThink step by step and show your reasoning before the final answer.';
  if(flags.concise) s += '\n\nBe concise: answer in as few words as possible.';
  if(cfg.lang) s += `\n\nAlways respond in ${cfg.lang}.`;
  return s;
}

const asText = c => typeof c==='string' ? c : c.map(p=>p.text||'').join('\n');
// Kaggle server limits: <=16 messages, <=12000 chars each, no empty content, max_tokens <=1024
function buildMessages(){
  const hist = cur.messages.slice(0,-1).filter(m=>!m.error && !m.img)
    .map(m=>({role:m.role, content:asText(m.content).slice(0,12000)})).filter(m=>m.content.trim()).slice(-15);
  while(hist.length && hist[0].role!=='user') hist.shift();
  return [{role:'system',content:systemPrompt().slice(0,12000)}, ...hist];
}

/* ---------- image generation ---------- */
let imgMode = false;
function setImgMode(on){
  imgMode = on; document.body.classList.toggle('imgmode', on); $('#imgModeBtn').classList.toggle('on', on);
  input.placeholder = on ? 'Describe an image to generate…' : 'Ask me anything...';
  $('#welcome h1').textContent = on ? 'What should we create?' : 'Let’s start a smart conversation';
  input.focus();
}
// shrink the PNG to a JPEG so chat history fits in browser storage
const toJpeg = src => new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const c=document.createElement('canvas');
  c.width=im.naturalWidth; c.height=im.naturalHeight; c.getContext('2d').drawImage(im,0,0); res(c.toDataURL('image/jpeg',0.85)); }; im.onerror=()=>rej(new Error('Invalid image data')); im.src=src; });
async function generateImage(prompt, src){
  const msg = {role:'assistant', img:true, content:prompt, image:'', src: okImg(src) ? src : undefined};
  cur.messages.push(msg); renderThread(); setSending(true); ctrl = new AbortController();
  try{
    const res = await fetch(cfg.base.replace(/\/$/,'')+(msg.src?'/images/edits':'/images/generations'), {method:'POST', headers:headers(), signal:ctrl.signal,
      body: JSON.stringify({prompt:prompt.slice(0,1000), size:$('#imgSize').value, n:1, response_format:'b64_json',
        ...(msg.src ? {image: msg.src.split(',')[1], strength: 0.6} : {})})});
    if(!res.ok){ const t=(await res.text()).slice(0,300);
      throw new Error(res.status===401?'Wrong or missing access token (Settings).':res.status===404?'This server has no image endpoint. Update kaggle_server.py and run the image-model cell in Kaggle.':res.status===503?'No image model loaded in Kaggle — run the image-model cell.':res.status===429?'GPU busy — try again in a moment.':`HTTP ${res.status}: ${t}`); }
    const b64 = (await res.json()).data?.[0]?.b64_json;
    if(!b64) throw new Error('Server returned no image');
    msg.image = await toJpeg('data:image/png;base64,'+b64);
  }catch(e){
    msg.error = true;
    msg.errText = e.name==='AbortError' ? '_(stopped)_' : `**Couldn't generate the image.** ${e instanceof TypeError ? 'Network/CORS — is the Kaggle cell + tunnel still running?' : e.message}`;
  }
  cur.updated = Date.now(); save(); renderThread(); renderHist(); setSending(false); ctrl=null;
}
$('#imgModeBtn').onclick = () => { setImgMode(!imgMode); if(innerWidth<820) document.body.classList.add('collapsed'); };
$('#modeOff').onclick = () => setImgMode(false);

async function generate(){
  const msg = {role:'assistant', content:''};
  cur.messages.push(msg);
  $('#thread').insertAdjacentHTML('beforeend', msgHTML(msg, cur.messages.length-1));
  const el = $('#thread').lastElementChild.querySelector('.b');
  el.classList.add('cursor');
  setSending(true);
  ctrl = new AbortController();
  try{
    if(!cfg.model) await loadModels(true);
    const res = await fetch(cfg.base.replace(/\/$/,'')+'/chat/completions', {
      method:'POST', headers:headers(), signal:ctrl.signal,
      body: JSON.stringify({model:cfg.model, stream:true, temperature:+cfg.temp, max_tokens:Math.min(+cfg.max||1024,1024),
        messages:buildMessages()})
    });
    if(!res.ok){ const t=(await res.text()).slice(0,300);
      throw new Error(res.status===401?'Wrong or missing access token (Settings → API key).':res.status===429?'GPU busy with another request — try again in a moment.':`HTTP ${res.status}: ${t}`); }
    if(!(res.headers.get('content-type')||'').includes('event-stream')){
      const j = await res.json(); msg.content = j.choices?.[0]?.message?.content ?? j.choices?.[0]?.text ?? '';
    } else {
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf='', last=0;
    for(;;){
      const {done,value} = await reader.read(); if(done) break;
      buf += dec.decode(value,{stream:true});
      const lines = buf.split('\n'); buf = lines.pop();
      for(const l of lines){
        const d = l.replace(/^data:\s*/,'').trim();
        if(!d || d==='[DONE]' || !l.startsWith('data')) continue;
        try{ const j=JSON.parse(d); const delta=j.choices?.[0]?.delta; msg.content += delta?.content || ''; }catch{}
      }
      if(performance.now()-last>50){ el.innerHTML = md(msg.content); scrollDown(); last=performance.now(); }
    }
    }
  }catch(e){
    if(e.name!=='AbortError'){ msg.error=true; const net = e instanceof TypeError ? ` (network/CORS — is the Kaggle cell + tunnel still running, and is COGNIVO_ALLOWED_ORIGINS exactly ${location.origin}?)` : '';
      msg.content += (msg.content?'\n\n':'') + `**Couldn't reach the model.** ${e.message}${net}\n\nOpen **Settings** and check the API base URL (currently \`${cfg.base}\`).`; el.classList.add('err'); }
  }
  el.classList.remove('cursor'); el.innerHTML = md(msg.content||'_(stopped)_');
  cur.updated = Date.now(); save(); renderHist(); setSending(false); ctrl=null; scrollDown();
}
function stop(){ if(ctrl){ ctrl.abort(); } }
function setSending(on){
  const b=$('#sendBtn'); b.classList.toggle('stop',on); b.title = on?'Stop':'Send';
  b.innerHTML = on ? '<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M5 4l15 8-15 8 3-8z"/></svg>';
}

/* ---------- models ---------- */
let lastErr='';
async function loadModels(pickFirst){
  try{
    const r = await fetch(cfg.base.replace(/\/$/,'')+'/models',{headers:headers()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const ids = (await r.json()).data.map(m=>m.id);
    if(pickFirst || !cfg.model || !ids.includes(cfg.model)) { cfg.model = ids[0]||''; LS.set('cg.cfg',cfg); }
    $('#modelMenu').innerHTML = ids.map(id=>`<button class="${id===cfg.model?'on':''}" data-m="${esc(id)}">${esc(id)}</button>`).join('');
    $('#conn').textContent='Connected · GPU'; $('#conn').style.color='#5fd37a';
    updateModelName(); return ids;
  }catch(e){
    lastErr = e instanceof TypeError ? `Network/CORS error reaching ${cfg.base}/models — check the tunnel URL is live and COGNIVO_ALLOWED_ORIGINS is ${location.origin}` : e.message==='HTTP 401' ? 'Wrong or missing access token' : e.message;
    $('#conn').textContent='Not connected'; $('#conn').style.color='';
    $('#modelMenu').innerHTML = `<button data-open="settings">Configure server…</button>`;
    if(pickFirst) throw new Error('Could not list models from '+cfg.base+' ('+e.message+')');
    return [];
  }
}
function updateModelName(){ $('#modelName').textContent = cfg.model ? 'Cognivo · '+cfg.model.split('/').pop() : 'Cognivo Core v1'; }
$('#modelBtn').onclick = e => { e.stopPropagation(); $('#moreMenu').classList.remove('open'); $('#modelMenu').classList.toggle('open'); };
$('#modelMenu').onclick = e => { const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.open) return openSettings();
  cfg.model=b.dataset.m; LS.set('cg.cfg',cfg); loadModels(); toast('Model: '+cfg.model); };
$('#moreBtn').onclick = e => { e.stopPropagation(); $('#modelMenu').classList.remove('open'); $('#moreMenu').classList.toggle('open'); };
document.addEventListener('click', ()=>document.querySelectorAll('.menu').forEach(m=>m.classList.remove('open')));
$('#moreMenu').onclick = e => {
  const a = e.target.dataset.act;
  if(a==='clear'){ if(confirm('Delete ALL chats?')){ chats=[]; cur=null; save(); renderThread(); renderHist(); } return; }
  if(!cur) return toast('No chat open');
  if(a==='rename'){ const t=prompt('Chat title',cur.title); if(t){cur.title=t; save(); renderHist();} }
  if(a==='delete') deleteChat(cur.id);
  if(a==='export'){ const blob=new Blob([transcript()],{type:'text/markdown'}); const u=URL.createObjectURL(blob); Object.assign(document.createElement('a'),{href:u,download:cur.title.replace(/[^\w ]/g,'')+'.md'}).click(); }
};
const transcript = () => `# ${cur.title}\n\n` + cur.messages.map(m=>`**${m.role==='user'?cfg.name:'Cognivo'}:**\n${m.display??(typeof m.content==='string'?m.content:m.content[0].text)}`).join('\n\n');

/* ---------- composer ---------- */
const input = $('#input');
function autosize(){ input.style.height='auto'; input.style.height=Math.min(input.scrollHeight,220)+'px'; }
input.oninput = autosize;
input.onkeydown = e => { if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); send(); } };
$('#sendBtn').onclick = send;
// downscale an image to fit maxSide and re-encode as JPEG (keeps uploads and saved chats small)
const shrink = (src,maxSide,q) => new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{
  const k=Math.min(1,maxSide/Math.max(im.naturalWidth,im.naturalHeight)), c=document.createElement('canvas');
  c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k);
  const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); };
  im.onerror=()=>rej(new Error('bad image')); im.src=src; });
$('#attachBtn').onclick = () => $('#fileIn').click();
$('#fileIn').onchange = e => { addFiles([...e.target.files]); e.target.value=''; };
async function addFiles(files){
  for(const f of files){
    if(f.size>8e6){ toast(f.name+' is too large'); continue; }
    if(f.type.startsWith('image/')){
      try{ const url = URL.createObjectURL(f);
        attachments.push({name:f.name, type:'image', data:await shrink(url,1024,0.88), thumb:await shrink(url,240,0.8)}); URL.revokeObjectURL(url);
      }catch{ toast("Couldn't read "+f.name); }
    } else if(!f.type || f.type.startsWith('text/') || /json|xml|javascript|csv|yaml|x-sh|sql/.test(f.type)){
      attachments.push({name:f.name,type:'text',data:(await f.text()).slice(0,11000)});
    } else toast(f.name+': only photos and text/code files are supported');
  }
  renderFiles();
}
document.addEventListener('paste', e => { const fs=[...e.clipboardData.files]; if(fs.length) addFiles(fs); });
function renderFiles(){
  $('#files').innerHTML = attachments.map((a,i)=>`<span class="chip">${a.type==='image'&&okImg(a.thumb)?`<img src="${a.thumb}" alt="">`:'📄'} ${esc(a.name)}<button data-i="${i}" title="Remove">✕</button></span>`).join('');
}
$('#files').onclick = e => { const b=e.target.closest('button'); if(b){ attachments.splice(+b.dataset.i,1); renderFiles(); } };


// cards / nav prompts
document.querySelectorAll('[data-prompt]').forEach(b => b.onclick = () => {
  newChat(); input.value = b.dataset.prompt.replace(/\\n/g,'\n'); autosize(); input.focus();
  if(b.closest('.nav')) send();
});

/* ---------- sidebar + header ---------- */
$('#collapse').onclick = () => document.body.classList.add('collapsed');
$('#openSide').onclick = () => document.body.classList.remove('collapsed');
if(innerWidth<820) document.body.classList.add('collapsed');
$('#newChat').onclick = newChat;
document.addEventListener('keydown', e => {
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='n' && e.altKey===false){ e.preventDefault(); newChat(); }
  if(e.key==='Escape') stop();
});
$('#shareBtn').onclick = async () => {
  if(!cur) return toast('Start a chat first');
  const t = transcript();
  if(navigator.share){ try{ await navigator.share({title:cur.title,text:t}); return; }catch{} }
  navigator.clipboard.writeText(t); toast('Transcript copied');
};
$('#linkBtn').onclick = () => { navigator.clipboard.writeText(location.href.split('#')[0] + (cur?'#chat='+cur.id:'')); toast('Link copied'); };
function info(t,b){ $('#infoT').textContent=t; $('#infoB').innerHTML=b; $('#infoDlg').showModal(); }
$('#upgradeBtn').onclick = () => info('Full access','You are running your own model on your own GPU, so everything is unlocked. Bigger GPU → bigger model: set a different <code>MODEL</code> in <code>start.sh</code>.');
$('#kbBtn').onclick = () => toast('Knowledge Base coming soon');
$('#tplBtn').onclick = () => { newChat(); input.value='Act as an expert [role]. My goal is [goal]. Constraints: [constraints]. Output format: [format].'; autosize(); input.focus(); };

/* ---------- settings ---------- */
function openSettings(){
  $('#sBase').value = cfg.base===defaults.base ? '' : cfg.base; $('#sKey').value=cfg.key;
  $('#sModel').value = cfg.model||''; setStatus('not tested','');
  $('#settingsDlg').showModal();
}
$('#settingsBtn').onclick = openSettings;
// accept the tunnel URL with or without /v1 and trailing slash
const normBase = u => { u=u.trim().replace(/\/+$/,''); return !u ? defaults.base : /\/v1$/.test(u) ? u : u+'/v1'; };
const readForm = () => ({...cfg, base:normBase($('#sBase').value), key:$('#sKey').value.trim(),
  model:$('#sModel').value.trim()});
function setStatus(t,c){ const e=$('#sStatus'); e.textContent='Status: '+t; e.className='status '+c; }
$('#testBtn').onclick = async () => {
  const old=cfg; cfg=readForm(); setStatus('testing…','');
  const ids = await loadModels(); ids.length ? setStatus('OK - ready to connect','ok') : setStatus(lastErr||'Could not reach '+cfg.base+'/models','bad');
  if(ids.length){ $('#sModels').innerHTML = ids.map(id=>`<option value="${esc(id)}">`).join(''); $('#sModel').value = cfg.model; }
  cfg=old; LS.set('cg.cfg',cfg);  // testing must not save unsaved values
};
$('#settingsDlg').addEventListener('close', () => {
  if($('#settingsDlg').returnValue!=='save') return;
  cfg=readForm(); LS.set('cg.cfg',cfg); applyUser(); loadModels(); toast('Settings saved');
});
function applyUser(){ $('#uname').textContent=cfg.name; $('#avatar').textContent=cfg.name[0].toUpperCase(); }

/* ---------- init ---------- */
applyUser(); renderHist();
const hashId = (location.hash.match(/chat=([\w-]+)/)||[])[1];
if(hashId) openChat(hashId); else renderThread();
updateModelName(); loadModels();
</script>
</body>
